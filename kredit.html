<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Credit Center - Infinity Gadget</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #loading-overlay { backdrop-filter: blur(4px); }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid #ef4444; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen bg-gray-200 sm:p-6">

    <div class="w-full max-w-[1400px] bg-white shadow-2xl relative sm:rounded-[40px] overflow-hidden flex flex-col h-screen sm:h-[92vh]">
        
        <div class="flex-1 overflow-y-auto pb-24">
            <!-- Header Merah -->
            <div class="bg-gradient-to-r from-red-600 to-red-800 p-6 md:p-14 rounded-b-[30px] md:rounded-b-[60px] text-white shadow-lg relative z-10">
                <div class="flex items-center justify-between mb-4 md:mb-10">
                    <div class="flex items-center gap-3 md:gap-4">
                        <div class="bg-black text-red-500 font-bold p-1.5 md:p-2 rounded-lg text-lg md:text-2xl shadow-md">IG</div>
                        <div>
                            <h1 class="font-bold text-xl md:text-3xl leading-tight">INFINITY GADGET</h1>
                            <p class="text-[11px] md:text-base text-red-200">Smart Credit Center</p>
                        </div>
                    </div>
                    <a href="index.html?tab=kasir" class="bg-white/20 hover:bg-white/30 text-white text-xs md:text-sm font-semibold px-3 py-1.5 md:px-5 md:py-2.5 rounded-full backdrop-blur-sm transition border border-white/30 flex items-center gap-1.5 md:gap-2 cursor-pointer shadow-sm">
                        <i class="fa-solid fa-arrow-right-from-bracket"></i> <span class="hidden sm:inline">Keluar</span>
                    </a>
                </div>
                
                <p class="text-sm md:text-lg font-medium mt-4 text-red-100 tracking-wider">TOTAL SISA KREDIT</p>
                <h2 id="total-sisa" class="text-4xl md:text-7xl font-extrabold mb-4 md:mb-6 drop-shadow-md tracking-tight">Memuat...</h2>
                <div class="bg-white/20 inline-block px-4 py-1.5 md:px-5 md:py-2.5 rounded-full backdrop-blur-sm border border-white/20 shadow-sm">
                    <p class="text-[11px] md:text-base font-medium">Dari <span id="count-aktif-label" class="font-bold">...</span> pelanggan aktif</p>
                </div>
            </div>

            <!-- Stats Boxes -->
            <div class="flex justify-between bg-white mx-4 md:mx-16 -mt-8 md:-mt-14 rounded-2xl md:rounded-3xl shadow-xl p-4 md:p-10 relative z-20 border border-gray-100">
                <div class="text-center w-1/3 border-r border-gray-100 px-1 md:px-4">
                    <div class="bg-red-50 text-red-600 w-10 h-10 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-2 md:mb-4 shadow-sm"><i class="fa-solid fa-users text-base md:text-2xl"></i></div>
                    <p class="text-[9px] md:text-sm text-gray-500 font-bold uppercase tracking-widest mb-1 md:mb-2">Aktif</p>
                    <p id="count-aktif" class="text-2xl md:text-5xl font-extrabold text-gray-800">...</p>
                </div>
                <div class="text-center w-1/3 border-r border-gray-100 px-1 md:px-4">
                    <div class="bg-orange-50 text-orange-500 w-10 h-10 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-2 md:mb-4 shadow-sm"><i class="fa-solid fa-triangle-exclamation text-base md:text-2xl"></i></div>
                    <p class="text-[9px] md:text-sm text-gray-500 font-bold uppercase tracking-widest mb-1 md:mb-2">Terlambat</p>
                    <p id="count-terlambat" class="text-2xl md:text-5xl font-extrabold text-gray-800">...</p>
                </div>
                <div class="text-center w-1/3 px-1 md:px-4">
                    <div class="bg-green-50 text-green-500 w-10 h-10 md:w-16 md:h-16 rounded-full flex items-center justify-center mx-auto mb-2 md:mb-4 shadow-sm"><i class="fa-solid fa-check text-base md:text-2xl"></i></div>
                    <p class="text-[9px] md:text-sm text-gray-500 font-bold uppercase tracking-widest mb-1 md:mb-2">Lunas</p>
                    <p id="count-lunas" class="text-2xl md:text-5xl font-extrabold text-gray-800">...</p>
                </div>
            </div>

            <!-- Tombol Aksi Utama -->
            <div class="flex flex-col md:flex-row gap-3 md:gap-8 px-5 md:px-16 mt-6 md:mt-12">
                <button onclick="toggleModal('modal-kredit')" class="bg-red-600 hover:bg-red-700 text-white rounded-2xl md:rounded-3xl p-4 md:p-8 w-full flex items-center gap-4 md:gap-6 cursor-pointer shadow-lg shadow-red-500/30 transition transform hover:-translate-y-1 text-left">
                    <div class="bg-white/20 text-white rounded-full w-12 h-12 md:w-20 md:h-20 flex items-center justify-center shrink-0"><i class="fa-solid fa-plus text-xl md:text-3xl"></i></div>
                    <div>
                        <p class="font-bold text-base md:text-2xl mb-0.5 md:mb-1">Buat kredit baru</p>
                        <p class="text-[11px] md:text-base text-red-200">Daftarkan HP & Pelanggan</p>
                    </div>
                </button>
                <button onclick="toggleModal('modal-cicilan')" class="bg-[#f0f4f8] hover:bg-[#e1e8f0] text-blue-900 border-2 border-blue-100 rounded-2xl md:rounded-3xl p-4 md:p-8 w-full flex items-center gap-4 md:gap-6 cursor-pointer shadow-md transition transform hover:-translate-y-1 text-left">
                    <div class="bg-blue-900 text-white rounded-full w-12 h-12 md:w-20 md:h-20 flex items-center justify-center shrink-0 shadow-inner"><i class="fa-solid fa-wallet text-lg md:text-3xl"></i></div>
                    <div>
                        <p class="font-bold text-base md:text-2xl mb-0.5 md:mb-1">Terima cicilan</p>
                        <p class="text-[11px] md:text-base text-blue-500">Catat pembayaran masuk</p>
                    </div>
                </button>
            </div>

            <!-- Daftar Pantauan Kredit -->
            <div class="px-5 md:px-16 mt-8 md:mt-12 mb-8">
                <div class="flex justify-between items-center mb-4 md:mb-6">
                    <h3 class="font-bold text-gray-800 text-lg md:text-2xl">Pantauan kredit</h3>
                    <span class="text-xs md:text-sm text-gray-400">Klik kartu untuk Edit / Hapus</span>
                </div>
                
                <div id="pantauan-list" class="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-6">
                    <div class="col-span-1 md:col-span-2 text-center py-10 text-gray-400">
                        <i class="fa-solid fa-circle-notch fa-spin mb-3 text-2xl md:text-3xl"></i><br>
                        <span class="text-sm md:text-lg">Memuat data pelanggan...</span>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Bottom Navigation -->
        <div class="absolute bottom-0 w-full bg-white border-t border-gray-100 flex justify-around px-2 md:px-4 py-3 md:py-5 z-30 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] sm:rounded-b-[40px]">
            <a href="index.html?tab=kasir" class="text-red-600 flex flex-col items-center w-1/4 transition hover:scale-105 cursor-pointer">
                <i class="fa-solid fa-house text-xl md:text-3xl mb-1 md:mb-2"></i>
                <span class="text-[10px] md:text-sm font-bold">Beranda</span>
            </a>
            <button class="text-gray-400 hover:text-red-500 flex flex-col items-center w-1/4 transition hover:scale-105" onclick="alert('Fitur sedang dikembangkan')">
                <i class="fa-solid fa-users text-xl md:text-3xl mb-1 md:mb-2"></i>
                <span class="text-[10px] md:text-sm font-medium">Pelanggan</span>
            </button>
            <button class="text-gray-400 hover:text-red-500 flex flex-col items-center w-1/4 transition hover:scale-105" onclick="alert('Fitur sedang dikembangkan')">
                <i class="fa-solid fa-receipt text-xl md:text-3xl mb-1 md:mb-2"></i>
                <span class="text-[10px] md:text-sm font-medium">Cicilan</span>
            </button>
            <button class="text-gray-400 hover:text-red-500 flex flex-col items-center w-1/4 transition hover:scale-105" onclick="alert('Fitur sedang dikembangkan')">
                <i class="fa-solid fa-chart-simple text-xl md:text-3xl mb-1 md:mb-2"></i>
                <span class="text-[10px] md:text-sm font-medium">Laporan</span>
            </button>
        </div>
    </div>

    <!-- MODAL 1: FORM BUAT KREDIT (DENGAN FOTO) -->
    <div id="modal-kredit" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-center items-end sm:items-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-t-[25px] sm:rounded-[30px] p-6 md:p-10 transform transition-all max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-6 md:mb-8">
                <h3 class="font-bold text-xl md:text-3xl text-gray-800">Buat Kredit Baru</h3>
                <button onclick="toggleModal('modal-kredit')" class="bg-gray-100 hover:bg-red-100 text-gray-500 hover:text-red-600 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="form-kredit" onsubmit="submitKredit(event)" class="space-y-4 md:space-y-5">
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Nama Lengkap</label><input type="text" id="k_nama" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">No. WhatsApp</label><input type="number" id="k_hp" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Tipe HP / Barang</label><input type="text" id="k_tipe" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div class="flex gap-3">
                    <div class="w-1/2"><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Total Harga</label><input type="number" id="k_harga" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                    <div class="w-1/2"><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Sisa Kredit Awal</label><input type="number" id="k_sisa" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                </div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Jatuh Tempo (Cth: 15/11/2026)</label><input type="text" id="k_tempo" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div>
                    <label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Foto HP / Barang (Opsional)</label>
                    <input type="file" id="k_foto" accept="image/*" class="w-full p-2.5 border-2 border-gray-100 rounded-xl bg-gray-50 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">
                </div>
                <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-4 rounded-xl mt-4 transition shadow-lg text-base shadow-red-500/30">Simpan Data Kredit</button>
            </form>
        </div>
    </div>

    <!-- MODAL 2: FORM TERIMA CICILAN -->
    <div id="modal-cicilan" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-center items-end sm:items-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-t-[25px] sm:rounded-[30px] p-6 md:p-10 transform transition-all shadow-2xl">
            <div class="flex justify-between items-center mb-6 md:mb-8">
                <h3 class="font-bold text-xl md:text-3xl text-gray-800">Terima Cicilan</h3>
                <button onclick="toggleModal('modal-cicilan')" class="bg-gray-100 hover:bg-blue-100 text-gray-500 hover:text-blue-600 w-10 h-10 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="form-cicilan" onsubmit="submitCicilan(event)" class="space-y-4">
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">ID Kredit (Cth: KR-001)</label><input type="text" id="c_id" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition uppercase font-mono text-sm tracking-wider"></div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Nominal Pembayaran</label><input type="number" id="c_nominal" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition text-sm"></div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Keterangan / Catatan</label><input type="text" id="c_ket" required placeholder="Cth: Cicilan Bulan 1" class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-blue-500 outline-none transition text-sm"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-4 rounded-xl mt-4 transition shadow-lg text-base shadow-blue-500/30">Catat Pembayaran</button>
            </form>
        </div>
    </div>

    <!-- MODAL 3: EDIT / HAPUS -->
    <div id="modal-edit" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-center items-end sm:items-center p-4">
        <div class="bg-white w-full max-w-2xl rounded-t-[25px] sm:rounded-[30px] p-6 md:p-10 transform transition-all max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="font-bold text-xl md:text-3xl text-gray-800">Edit / Hapus Kredit</h3>
                    <p id="edit-id-label" class="text-xs font-mono text-red-600 mt-0.5"></p>
                </div>
                <button onclick="toggleModal('modal-edit')" class="bg-gray-100 hover:bg-gray-200 text-gray-500 w-10 h-10 rounded-full flex items-center justify-center transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="form-edit" onsubmit="submitEdit(event)" class="space-y-4">
                <input type="hidden" id="e_id">
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Nama Lengkap</label><input type="text" id="e_nama" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">No. WhatsApp</label><input type="number" id="e_hp" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Tipe HP / Barang</label><input type="text" id="e_tipe" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div class="flex gap-3">
                    <div class="w-1/2"><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Total Harga</label><input type="number" id="e_harga" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                    <div class="w-1/2"><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Sisa Kredit</label><input type="number" id="e_sisa" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                </div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Jatuh Tempo</label><input type="text" id="e_tempo" required class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm"></div>
                <div><label class="block text-xs md:text-sm font-bold text-gray-600 mb-1.5">Status</label>
                    <select id="e_status" class="w-full p-3 border-2 border-gray-100 rounded-xl bg-gray-50 focus:bg-white focus:border-red-500 outline-none transition text-sm">
                        <option value="Berjalan">Berjalan</option>
                        <option value="Terlambat">Terlambat</option>
                        <option value="Lunas">Lunas</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="hapusKredit()" class="w-1/3 bg-gray-100 hover:bg-red-50 text-red-600 font-bold p-4 rounded-xl transition border border-red-200">Hapus</button>
                    <button type="submit" class="w-2/3 bg-red-600 hover:bg-red-700 text-white font-bold p-4 rounded-xl transition shadow-lg shadow-red-500/30">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="loading-overlay" class="fixed inset-0 bg-black/60 z-[60] hidden flex-col items-center justify-center backdrop-blur-sm">
        <div class="spinner mb-4"></div>
        <p class="text-white font-semibold text-base" id="loading-text">Memproses...</p>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwW4j4fNXHs1lWznqzcOkBjooh2lO-Mtaj5RjLXaWP6NXcbHCjAJDFAF1S6Lool9IPkTA/exec';
        let allDataKredit = [];

        function formatRupiah(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); }
        function showLoading(show, text="Memproses...") {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = text;
            if(show) { overlay.classList.remove('hidden'); overlay.classList.add('flex'); }
            else { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }
        }

        async function loadDashboardData() {
            try {
                const response = await fetch(SCRIPT_URL); const data = await response.json();
                allDataKredit = data.listPelanggan || [];
                
                document.getElementById('total-sisa').innerText = formatRupiah(data.totalSisaKredit);
                document.getElementById('count-aktif').innerText = data.pelangganAktif;
                document.getElementById('count-aktif-label').innerText = data.pelangganAktif;
                document.getElementById('count-terlambat').innerText = data.terlambat;
                document.getElementById('count-lunas').innerText = data.lunas;
                
                const listContainer = document.getElementById('pantauan-list'); listContainer.innerHTML = ''; 
                
                if (allDataKredit.length > 0) {
                    allDataKredit.forEach(item => {
                        let statusColor = "bg-gray-100 text-gray-600";
                        if(item.status === 'Terlambat') { statusColor = "bg-red-100 text-red-700"; } 
                        else if(item.status === 'Berjalan') { statusColor = "bg-blue-100 text-blue-700"; }
                        
                        let thumbnail = `<div class="bg-blue-500 text-white rounded-xl md:rounded-2xl w-12 h-12 md:w-16 md:h-16 flex items-center justify-center shrink-0 shadow-md"><i class="fa-solid fa-mobile-screen-button text-lg"></i></div>`;
                        if(item.foto && item.foto.startsWith('http')) {
                            thumbnail = `<img src="${item.foto}" class="w-12 h-12 md:w-16 md:h-16 rounded-xl md:rounded-2xl object-cover shrink-0 shadow-md border" />`;
                        }

                        let tanggalTeks = item.tempo;
                        if (typeof tanggalTeks === 'string' && tanggalTeks.includes('T')) {
                            const d = new Date(tanggalTeks); tanggalTeks = d.toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'});
                        }

                        listContainer.innerHTML += `
                            <div class="bg-white border-2 border-gray-50 hover:border-gray-100 rounded-2xl md:rounded-3xl p-4 md:p-6 flex items-center justify-between transition cursor-pointer shadow-sm hover:shadow-md" onclick="bukaEdit('${item.id}')">
                                <div class="flex items-center gap-3 md:gap-5 flex-1">
                                    ${thumbnail}
                                    <div>
                                        <div class="flex items-center gap-2 mb-0.5 md:mb-1">
                                            <p class="font-bold text-sm md:text-lg text-gray-800">${item.nama}</p>
                                            <span class="text-[9px] md:text-xs font-mono text-gray-500 bg-gray-50 px-1.5 md:px-2 py-0.5 rounded-md border">${item.id}</span>
                                        </div>
                                        <p class="text-[11px] md:text-sm text-gray-500">${item.tipe} • Tempo: <span class="font-semibold">${tanggalTeks}</span></p>
                                    </div>
                                </div>
                                <span class="${statusColor} text-[10px] md:text-sm font-extrabold px-2.5 py-1.5 md:px-4 md:py-2 rounded-full uppercase tracking-wide">${item.status}</span>
                            </div>`;
                    });
                } else { listContainer.innerHTML = '<div class="col-span-1 md:col-span-2 text-center py-10 text-gray-400 text-sm md:text-lg">Belum ada data kredit aktif.</div>'; }
            } catch (error) {
                document.getElementById('total-sisa').innerText = "Gagal memuat";
            }
        }

        window.onload = loadDashboardData;

        function toggleModal(modalID) { 
            const modal = document.getElementById(modalID); modal.classList.toggle('hidden'); 
            if(!modal.classList.contains('hidden')) { setTimeout(() => { const firstInput = modal.querySelector('input'); if(firstInput) firstInput.focus(); }, 100); }
        }

        function bukaEdit(id) {
            const data = allDataKredit.find(x => x.id === id);
            if(!data) return;
            document.getElementById('e_id').value = data.id;
            document.getElementById('edit-id-label').innerText = "ID: " + data.id;
            document.getElementById('e_nama').value = data.nama;
            document.getElementById('e_hp').value = data.hp || '';
            document.getElementById('e_tipe').value = data.tipe;
            document.getElementById('e_harga').value = data.harga || 0;
            document.getElementById('e_sisa').value = data.sisa;
            document.getElementById('e_tempo').value = data.tempo;
            document.getElementById('e_status').value = data.status;
            toggleModal('modal-edit');
        }

        async function submitKredit(e) {
            e.preventDefault();
            const fileInput = document.getElementById('k_foto');
            
            if (fileInput.files && fileInput.files[0]) {
                showLoading(true, "Mengunggah foto & menyimpan data...");
                const reader = new FileReader();
                reader.onload = async function(uploadEvent) {
                    const base64Data = uploadEvent.target.result;
                    await kirimDataKreditBaru(base64Data);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                showLoading(true, "Menyimpan Data Kredit...");
                await kirimDataKreditBaru("");
            }
        }

        async function kirimDataKreditBaru(fotoBase64) {
            toggleModal('modal-kredit');
            const payload = { 
                action: 'buat_kredit', 
                nama: document.getElementById('k_nama').value, 
                hp: document.getElementById('k_hp').value, 
                tipe: document.getElementById('k_tipe').value, 
                harga: document.getElementById('k_harga').value, 
                sisa: document.getElementById('k_sisa').value, 
                jatuh_tempo: document.getElementById('k_tempo').value,
                foto_base64: fotoBase64
            };
            try { 
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                
                if(result.status === 'sukses') {
                    alert('Berhasil disimpan ke Server!'); 
                    document.getElementById('form-kredit').reset(); 
                    loadDashboardData(); 
                } else {
                    alert('GAGAL TERSIMPAN: ' + result.pesan);
                }
            } catch (err) { alert('Gagal mengirim data. Cek koneksi Anda.'); } finally { showLoading(false); }
        }

        async function submitCicilan(e) {
            e.preventDefault(); toggleModal('modal-cicilan'); showLoading(true, "Mencatat Pembayaran...");
            const payload = { action: 'terima_cicilan', id_kredit: document.getElementById('c_id').value.toUpperCase(), nominal: document.getElementById('c_nominal').value, keterangan: document.getElementById('c_ket').value };
            try { 
                const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }); 
                const result = await res.json();
                if(result.status === 'sukses') {
                    alert('Cicilan berhasil dicatat!'); document.getElementById('form-cicilan').reset(); loadDashboardData(); 
                } else { alert('Gagal: ' + result.pesan); }
            } catch (err) { alert('Gagal mengirim data cicilan.'); } finally { showLoading(false); }
        }

        async function submitEdit(e) {
            e.preventDefault(); toggleModal('modal-edit'); showLoading(true, "Memperbarui Data...");
            const payload = { 
                action: 'edit_kredit', 
                id: document.getElementById('e_id').value,
                nama: document.getElementById('e_nama').value, 
                hp: document.getElementById('e_hp').value, 
                tipe: document.getElementById('e_tipe').value, 
                harga: document.getElementById('e_harga').value, 
                sisa: document.getElementById('e_sisa').value, 
                jatuh_tempo: document.getElementById('e_tempo').value,
                status: document.getElementById('e_status').value
            };
            try { await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }); alert('Data berhasil diperbarui!'); loadDashboardData(); } 
            catch (err) { alert('Gagal memperbarui data.'); } finally { showLoading(false); }
        }

        async function hapusKredit() {
            const id = document.getElementById('e_id').value;
            if(!confirm("Yakin ingin menghapus data kredit " + id + "?")) return;
            toggleModal('modal-edit'); showLoading(true, "Menghapus Data...");
            try { 
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'hapus_kredit', id: id }) }); 
                alert('Data berhasil dihapus!'); loadDashboardData(); 
            } catch (err) { alert('Gagal menghapus data.'); } finally { showLoading(false); }
        }
    </script>
</body>
</html>
