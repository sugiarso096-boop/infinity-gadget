<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Gadget System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        :root { 
            --bg-color: #f8fafc; 
            --primary-color: #3b82f6; 
            --primary-hover: #2563eb;
            --text-main: #1e293b; 
            --text-muted: #64748b; 
            --card-bg: #ffffff; 
            --radius-card: 16px;
            --radius-btn: 10px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        #loginModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { background: white; padding: 40px 30px; border-radius: var(--radius-card); width: 100%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }

        #scannerModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.9); backdrop-filter: blur(5px); z-index: 2000; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .scanner-card { background: white; padding: 25px; border-radius: var(--radius-card); width: 100%; max-width: 400px; text-align: center; }
        #readerTop { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 20px; background: #f8fafc; }

        .sidebar { 
            width: 260px; 
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('robot.png');
            background-size: cover; background-position: left center;
            color: #fff; display: flex; flex-direction: column; padding: 25px 0; z-index: 1500; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 20px rgba(0,0,0,0.05); 
        }
        
        .logo-area { text-align: center; margin-bottom: 35px; padding-top: 15px; }
        .logo-area h2 { color: #fff; font-weight: 800; letter-spacing: 2px; font-size: 26px; line-height: 1.1; }
        .logo-area h2 .icon-infin { display: block; font-size: 50px; color: #fff; font-weight: 300; line-height: 0.8; }
        .logo-area h2 .text-gadget { display: block; color: var(--primary-color); font-size: 15px; letter-spacing: 6px; font-weight: 600; margin-top: 4px; }
        
        .menu-title { font-size: 11px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1.5px; margin: 15px 25px 10px; font-weight: 600; }
        .nav-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; color: #cbd5e1; font-size: 14px; transition: all 0.2s ease; margin: 4px 15px; border-radius: var(--radius-btn); font-weight: 500; text-decoration: none; }
        .nav-item i { width: 28px; font-size: 16px; }
        .nav-item:hover { color: #f8fafc; background-color: rgba(255,255,255,0.15); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(3px); z-index: 1400; }
        .sidebar-overlay.show { display: block; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; width: 100%; position: relative; }
        .topbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); gap: 15px; z-index: 500; position: sticky; top: 0; }
        .topbar-left { display: flex; align-items: center; flex: 1; gap: 15px; }
        .menu-toggle { display: none; font-size: 22px; cursor: pointer; color: var(--text-main); }
        
        .search-container { position: relative; width: 100%; max-width: 420px; display: flex; gap: 10px; align-items: center; }
        .search-bar { background: #f1f5f9; padding: 10px 18px; border-radius: 50px; display: flex; align-items: center; flex: 1; border: 1px solid transparent; }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 8px; width: 100%; font-size: 13px; color: var(--text-main); }
        
        .btn-scan-top { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }

        .search-result-box { position: absolute; top: 110%; left: 0; right: 50px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; z-index: 1000; max-height: 350px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 5px; }
        .search-item { padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; border-bottom: 1px solid #f1f5f9; }
        .item-left { display: flex; align-items: center; gap: 12px; }
        .item-img { width: 42px; height: 42px; border-radius: 8px; object-fit: cover; background: #f1f5f9; border: 1px solid #e2e8f0; }

        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 4px 8px; border-radius: 10px; }
        .avatar { width: 38px; height: 38px; background: linear-gradient(135deg, #1e293b, #334155); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
        .user-info h4 { font-size: 13.5px; margin: 0; font-weight: 600; }
        .user-info p { font-size: 11px; color: var(--text-muted); margin: 0; }

        .page-content { padding: 30px; display: none; }
        .page-content.active { display: block; animation: slideFadeUp 0.3s; }
        @keyframes slideFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* PERUBAHAN BANNER DAN QUOTE ADA DI SINI */
        .banner { 
            width: 100%; 
            height: 260px; 
            background: url('robot.png') center/cover; 
            border-radius: var(--radius-card); 
            margin-bottom: 25px; 
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.15); 
            display: flex;
            align-items: center;
            padding: 0 50px;
            position: relative;
        }
        .banner-text {
            max-width: 45%;
        }
        .banner-text h2 {
            font-size: 28px;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 12px;
            line-height: 1.2;
        }
        .banner-text h2 span {
            color: #ef4444; /* Warna merah senada dengan robot */
        }
        .banner-text p {
            font-size: 14px;
            color: #334155;
            line-height: 1.6;
            font-weight: 500;
            font-style: italic;
            position: relative;
            padding-left: 18px;
            border-left: 4px solid #ef4444;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 22px; border-radius: var(--radius-card); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); display: flex; flex-direction: column; cursor: pointer; border: 1px solid rgba(0,0,0,0.02); }
        .stat-header { display: flex; align-items: center; gap: 14px; margin-bottom: 15px; }
        .icon-box { width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .icon-blue { background: #eff6ff; color: #3b82f6; }
        .icon-purple { background: #faf5ff; color: #a855f7; }
        .icon-orange { background: #fff7ed; color: #f97316; }
        .icon-green { background: #f0fdf4; color: #22c55e; }
        .stat-title { font-size: 13px; color: var(--text-muted); }
        .stat-value { font-size: 26px; font-weight: 700; color: var(--text-main); }

        .form-card { background: var(--card-bg); padding: 30px; border-radius: var(--radius-card); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-main); margin-bottom: 6px; font-weight: 600; }
        .form-control { width: 100%; padding: 12px 16px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-btn); font-size: 14px; outline: none; }
        .form-control:focus { background-color: #fff; border-color: var(--primary-color); }
        
        .btn { width: 100%; padding: 13px; border: none; border-radius: var(--radius-btn); font-size: 14.5px; font-weight: 600; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 12px; display: none; background: #f1f5f9; border: 2px dashed #cbd5e1; }
        #previewFoto { width: 100%; max-height: 220px; object-fit: contain; margin-top: 12px; border-radius: 10px; display: none; background: #f1f5f9; padding: 8px; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .topbar { padding: 12px 15px; }
            .user-info { display: none; }
            .page-content { padding: 15px; }
            .form-card { padding: 20px 15px; }
            .search-container { max-width: 100%; }
            
            /* Penyesuaian Banner untuk Tampilan Mobile/HP */
            .banner { height: auto; min-height: 180px; padding: 20px; align-items: flex-start; }
            .banner-text { max-width: 100%; background: rgba(255, 255, 255, 0.85); padding: 15px; border-radius: 12px; backdrop-filter: blur(4px); margin-top: 10px; }
            .banner-text h2 { font-size: 20px; margin-bottom: 8px; }
            .banner-text p { font-size: 12.5px; border-left: 3px solid #ef4444; padding-left: 12px; }
        }
    </style>
</head>
<body>
