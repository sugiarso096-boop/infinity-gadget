<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Gadget - Kasir & Servis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-md py-3 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-xl font-bold tracking-wider text-cyan-400">INFINITY GADGET</span>
            <span class="text-xs bg-slate-800 text-slate-300 px-2 py-1 rounded">Sistem Kasir v2.0</span>
        </div>
        <div class="flex items-center space-x-2">
            <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
            <span class="text-sm text-slate-300">Bot Telegram: Online</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 p-4 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <!-- KOLOM KIRI: Input Transaksi & Produk -->
        <section class="lg:col-span-1 space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-semibold text-slate-700 mb-3 flex items-center gap-2">
                    🛒 Input Transaksi
                </h2>
                
                <!-- Cari Produk -->
                <div class="mb-3">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Cari Barcode / Nama Barang</label>
                    <input type="text" id="searchInput" placeholder="Ketik nama barang..." class="w-full px-3 py-2 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
                </div>

                <!-- Kategori Cepat -->
                <div class="mb-3">
                    <label class="block text-xs font-medium text-slate-500 mb-1">Kategori</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="pilihKategori('Pulsa')" class="p-2 text-xs bg-slate-100 hover:bg-cyan-50 hover:text-cyan-600 font-medium rounded border transition">Pulsa</button>
                        <button onclick="pilihKategori('Servis')" class="p-2 text-xs bg-slate-100 hover:bg-cyan-50 hover:text-cyan-600 font-medium rounded border transition">Servis</button>
                        <button onclick="pilihKategori('LCD')" class="p-2 text-xs bg-slate-100 hover:bg-cyan-50 hover:text-cyan-600 font-medium rounded border transition">LCD</button>
                    </div>
                </div>

                <!-- Info Produk Terpilih -->
                <div class="bg-slate-50 p-3 rounded-lg border mb-3">
                    <p class="text-xs text-slate-500">Produk Terpilih:</p>
                    <p id="selectedProduct" class="font-bold text-slate-800 text-sm">- Belum dipilih -</p>
                    <p id="selectedPrice" class="text-xs text-cyan-600 font-semibold mb-2">Rp 0</p>
                    
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">Jumlah:</span>
                        <div class="flex items-center space-x-2">
                            <button onclick="ubahQty(-1)" class="px-2 py-1 bg-white border rounded text-sm font-bold">-</button>
                            <span id="qtyVal" class="text-sm font-semibold w-6 text-center">1</span>
                            <button onclick="ubahQty(1)" class="px-2 py-1 bg-white border rounded text-sm font-bold">+</button>
                        </div>
                    </div>
                </div>

                <button onclick="tambahKeKeranjang()" class="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                    + Tambah ke Keranjang
                </button>
            </div>
        </section>

        <!-- KOLOM KANAN: Keranjang & Kontrol Telegram -->
        <section class="lg:col-span-2 space-y-4">
            <!-- Keranjang Belanja -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between min-h-[300px]">
                <div>
                    <h2 class="font-semibold text-slate-700 mb-3">📦 Keranjang Belanja</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="border-b text-xs text-slate-500">
                                    <th class="pb-2">Barang</th>
                                    <th class="pb-2 text-center">Qty</th>
                                    <th class="pb-2 text-right">Harga</th>
                                    <th class="pb-2 text-right">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody">
                                <tr class="border-b text-slate-400 italic">
                                    <td colspan="4" class="py-4 text-center">Keranjang masih kosong</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Bagian Total & Tombol Aksi Bayar -->
                <div class="mt-4 pt-4 border-t">
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-bold text-slate-700 text-lg">TOTAL:</span>
                        <span id="grandTotal" class="font-bold text-cyan-600 text-xl">Rp 0</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <button onclick="prosesBayar()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                            💳 Bayar & Simpan
                        </button>
                        <button onclick="cetakStruk()" class="bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
                            🖨️ Cetak Struk Thermal
                        </button>
                    </div>
                </div>
            </div>

            <!-- Panel Kontrol Telegram & Laporan -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="font-semibold text-slate-700 mb-3">⚡ Laporan & Kontrol Cepat (Telegram)</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <button onclick="kirimLaporanTelegram('rekap')" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-2 px-3 rounded-lg text-xs border border-indigo-200 transition text-center">
                        📊 Kirim Rekap Harian
                    </button>
                    <button onclick="kirimLaporanTelegram('stok')" class="bg-amber-50 hover:bg-amber-100 text-amber-700 font-medium py-2 px-3 rounded-lg text-xs border border-amber-200 transition text-center">
                        📦 Cek Stok LCD
                    </button>
                    <button onclick="kirimLaporanTelegram('servis')" class="bg-teal-50 hover:bg-teal-100 text-teal-700 font-medium py-2 px-3 rounded-lg text-xs border border-teal-200 transition text-center">
                        📝 Data Servis Masuk
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500">
        &copy; 2026 Infinity Gadget. All rights reserved.
    </footer>

    <!-- Script Integrasi -->
    <script>
        // Ganti dengan URL Web App Google Apps Script terbaru Anda yang sudah di-deploy
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgp_pzUFcer6xnCOwUs9b0dzwWCkFc9fEc7ntB8C5sPiPL1Xz69xgRX2M_0Ull65Ls9w/exec";

        let currentQty = 1;

        function ubahQty(nilai) {
            currentQty += nilai;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('qtyVal').innerText = currentQty;
        }

        function pilihKategori(kategori) {
            document.getElementById('selectedProduct').innerText = "Contoh Produk " + kategori;
            document.getElementById('selectedPrice').innerText = "Rp 150.000";
        }

        function tambahKeKeranjang() {
            alert("Fitur keranjang aktif. Silakan sesuaikan dengan fungsi database Apps Script Anda.");
        }

        function prosesBayar() {
            alert("Transaksi berhasil disimpan!");
        }

        function cetakStruk() {
            window.print();
        }

        function kirimLaporanTelegram(jenis) {
            alert("Mengirim laporan " + jenis + " ke Telegram...");
            // Contoh pemanggilan ke Google Apps Script:
            // fetch(SCRIPT_URL + "?action=Kirim&type=" + jenis)...
        }
    </script>
</body>
</html>
