<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Gadget v4</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --bg-color: #f8fafc; --primary-color: #3b82f6; --primary-hover: #2563eb; --text-main: #1e293b; --text-muted: #64748b; --card-bg: #ffffff; --radius-card: 16px; --radius-btn: 10px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }
        
        #loginModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px 30px; border-radius: var(--radius-card); width: 90%; max-width: 400px; text-align: center; }

        .sidebar { width: 260px; background: #0f172a; color: #fff; display: flex; flex-direction: column; padding: 25px 0; z-index: 1000; }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h2 { color: #fff; font-size: 24px; font-weight: 700; }
        .nav-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; color: #cbd5e1; font-size: 14px; margin: 4px 15px; border-radius: var(--radius-btn); }
        .nav-item.active { background: var(--primary-color); color: #fff; }

        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { background: #fff; padding: 15px 35px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .search-bar { background: #f1f5f9; padding: 10px 20px; border-radius: 50px; display: flex; align-items: center; width: 300px; }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 10px; width: 100%; }

        .page-content { padding: 35px; display: none; }
        .page-content.active { display: block; }

        .form-card { background: #fff; padding: 35px; border-radius: var(--radius-card); max-width: 650px; margin: 0 auto; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
        .form-control { width: 100%; padding: 12px 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-btn); outline: none; font-size: 14px; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-btn); font-size: 15px; font-weight: 600; cursor: pointer; color: white; background: var(--primary-color); }
        
        #previewFoto { width: 100%; max-height: 200px; object-fit: contain; margin-top: 10px; display: none; border-radius: 8px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <div id="loginModal">
        <div class="login-card">
            <h3>Infinity Gadget Access</h3>
            <p style="margin: 15px 0; font-size:13px; color:#64748b;">Silakan masuk ke sistem</p>
            <button class="btn" onclick="loginKaryawan()">Masuk Sebagai Kasir / Karyawan</button>
        </div>
    </div>

    <div class="sidebar">
        <div class="logo-area"><h2>INFINITY GADGET</h2></div>
        <div class="nav-item active" onclick="switchPage('dashboard', this)"><i class="fas fa-home" style="margin-right:10px;"></i> Dashboard</div>
        <div class="nav-item" onclick="switchPage('kasir', this)"><i class="fas fa-shopping-cart" style="margin-right:10px;"></i> Kasir & Input</div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="search-bar">
                <i class="fas fa-search" style="color:#94a3b8;"></i>
                <input type="text" id="searchInput" placeholder="Cek Stok & Harga..." onkeyup="cariBarang(event)">
            </div>
            <div style="font-weight: 600; font-size: 14px;" id="userName">Admin</div>
        </div>

        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page-content active">
            <h2 style="margin-bottom: 20px;">Dashboard Toko</h2>
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px;">
                <div class="form-card" style="margin:0; padding:20px;"><h4>Total Penjualan</h4><p id="angka-penjualan" style="font-size:24px; font-weight:bold; color:var(--primary-color);">Rp 0</p></div>
                <div class="form-card" style="margin:0; padding:20px;"><h4>Total Produk</h4><p id="angka-produk" style="font-size:24px; font-weight:bold; color:#10b981;">0 Barang</p></div>
            </div>
        </div>

        <!-- KASIR & INPUT -->
        <div id="page-kasir" class="page-content">
            <div class="form-card">
                <h3 style="margin-bottom: 20px;">Input Barang (Auto-Save v4)</h3>
                <form id="formKaryawan" onsubmit="kirimData(event)">
                    <div class="form-group">
                        <label>Jenis Input</label>
                        <select name="tipeForm" id="tipeForm" class="form-control" onchange="aturForm()">
                            <option value="penjualan">Kasir - Penjualan</option>
                            <option value="barang_masuk">Gudang - Barang Masuk</option>
                        </select>
                    </div>

                    <div class="form-group"><label>Nama Karyawan</label><input type="text" id="kasir" class="form-control" required></div>
                    <div class="form-group"><label>Barcode / IMEI</label><input type="text" id="barcode" class="form-control" placeholder="Opsional"></div>
                    <div class="form-group"><label>Nama Barang / Tipe HP</label><input type="text" id="barang" class="form-control" required></div>
                    
                    <div class="form-group" id="divKategori" style="display:none;">
                        <label>Kategori</label>
                        <input type="text" id="kategori" class="form-control" list="pilihanKategori" placeholder="Pilih/Ketik kategori">
                        <datalist id="pilihanKategori"><option value="TWS"><option value="Powerbank"><option value="LCD"><option value="Casing"></datalist>
                    </div>

                    <div class="form-group"><label>Jumlah (Qty)</label><input type="number" id="qty" class="form-control" value="1" required></div>
                    <div class="form-group" id="divHargaModal" style="display:none;"><label>Harga Modal</label><input type="number" id="hargaModal" class="form-control" value="0"></div>
                    <div class="form-group" id="divHargaJualInput" style="display:none;"><label>Harga Jual</label><input type="number" id="hargaJualInput" class="form-control" value="0"></div>
                    <div class="form-group" id="divTotalJual"><label>Total Penjualan</label><input type="number" id="totalJual" class="form-control" value="0"></div>

                    <div class="form-group" id="divFoto" style="display:none;">
                        <label>Upload Foto Fisik</label>
                        <input type="file" id="inputFoto" class="form-control" accept="image/*">
                        <img id="previewFoto" src="" alt="Preview">
                    </div>

                    <button type="submit" id="btnSubmit" class="btn"><i class="fas fa-save"></i> Simpan Data</button>
                </form>
                <p id="status" style="text-align: center; margin-top: 15px; color: #10b981; font-weight: 600;"></p>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyjUYfuAtipQ4jPGXaYvo6CI7SAwiSYqKhaziTsnGCxGaBYE_PeqcUiM3N2XsWLvJnN/exec';
        let fileB64 = "", mimeType = "", namaFile = "";

        function loginKaryawan() { document.getElementById('loginModal').style.display = 'none'; }
        function switchPage(id, el) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
            if(el) el.classList.add('active');
        }

        function muatDashboard() {
            fetch(scriptURL).then(r => r.json()).then(d => {
                document.getElementById('angka-penjualan').innerText = "Rp " + (d.penjualan || 0).toLocaleString('id-ID');
                document.getElementById('angka-produk').innerText = (d.produk || 0) + " Barang";
            }).catch(e => console.log(e));
        }
        window.onload = muatDashboard;

        function cariBarang(e) {
            if(e.key === "Enter") {
                let kw = document.getElementById('searchInput').value;
                alert("Mencari barang: " + kw);
            }
        }

        function aturForm() {
            let tipe = document.getElementById("tipeForm").value;
            if(tipe === "barang_masuk") {
                document.getElementById("divTotalJual").style.display = "none";
                document.getElementById("divHargaJualInput").style.display = "block";
                document.getElementById("divKategori").style.display = "block";
                document.getElementById("divFoto").style.display = "block";
                document.getElementById("divHargaModal").style.display = "block";
            } else {
                document.getElementById("divTotalJual").style.display = "block";
                document.getElementById("divHargaJualInput").style.display = "none";
                document.getElementById("divKategori").style.display = "none";
                document.getElementById("divFoto").style.display = "none";
                document.getElementById("divHargaModal").style.display = "none";
            }
        }

        // Kompresi foto otomatis
        document.getElementById("inputFoto").addEventListener("change", function(e) {
            let file = e.target.files[0];
            let btn = document.getElementById("btnSubmit");
            if(file) {
                btn.disabled = true;
                btn.innerHTML = "Memproses Foto...";
                namaFile = "compressed_" + file.name;
                mimeType = "image/jpeg";

                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.onload = function() {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        canvas.width = 800; canvas.height = 800;
                        ctx.drawImage(img, 0, 0, 800, 800);
                        let dataUrl = canvas.toDataURL("image/jpeg", 0.6);
                        fileB64 = dataUrl.split(',')[1];
                        
                        document.getElementById("previewFoto").src = dataUrl;
                        document.getElementById("previewFoto").style.display = "block";
                        btn.disabled = false;
                        btn.innerHTML = '<i class="fas fa-save"></i> Simpan Data';
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Kirim data via JSON murni (Anti-Error)
        function kirimData(e) {
            e.preventDefault();
            let btn = document.getElementById("btnSubmit");
            btn.disabled = true;
            btn.innerHTML = "Menyimpan...";

            let payload = {
                tipeForm: document.getElementById("tipeForm").value,
                kasir: document.getElementById("kasir").value,
                barcode: document.getElementById("barcode").value || "-",
                barang: document.getElementById("barang").value,
                kategori: document.getElementById("kategori").value || "Lainnya",
                qty: document.getElementById("qty").value,
                hargaModal: document.getElementById("hargaModal").value || 0,
                hargaJualInput: document.getElementById("hargaJualInput").value || 0,
                totalJual: document.getElementById("totalJual").value || 0,
                fotoB64: fileB64,
                mimeType: mimeType,
                namaFile: namaFile
            };

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.text())
            .then(msg => {
                document.getElementById("status").innerText = msg;
                document.getElementById("formKaryawan").reset();
                fileB64 = "";
                document.getElementById("previewFoto").style.display = "none";
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Simpan Data';
                muatDashboard();
            })
            .catch(err => {
                document.getElementById("status").innerText = "Gagal mengirim data.";
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-save"></i> Simpan Data';
            });
        }
    </script>
</body>
</html>
