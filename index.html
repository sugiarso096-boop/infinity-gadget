<style>
        :root { 
            --bg-color: #f8fafc; 
            --sidebar-bg: #0f172a; /* Dark Slate / Navy */
            --primary-color: #3b82f6; /* Tech Blue */
            --primary-hover: #2563eb;
            --text-main: #1e293b; 
            --text-muted: #64748b; 
            --card-bg: #ffffff; 
            --radius-card: 16px;
            --radius-btn: 10px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* MODAL PIN LOGIN */
        #loginModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px 30px; border-radius: var(--radius-card); width: 90%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); }
        .login-card h3 { margin-bottom: 8px; color: var(--text-main); font-weight: 700; font-size: 22px; }
        .login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }

        /* SIDEBAR */
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: #fff; display: flex; flex-direction: column; padding: 25px 0; z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 20px rgba(0,0,0,0.05); }
        .logo-area { text-align: center; margin-bottom: 35px; }
        .logo-area h2 { color: #fff; font-weight: 800; letter-spacing: 1.5px; font-size: 22px; }
        .logo-area h2 span { color: var(--primary-color); }
        .menu-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1.5px; margin: 15px 25px 10px; font-weight: 600; }
        .nav-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; color: #94a3b8; font-size: 14px; transition: all 0.2s ease; margin: 4px 15px; border-radius: var(--radius-btn); font-weight: 500; }
        .nav-item i { width: 28px; font-size: 16px; transition: transform 0.2s; }
        .nav-item:hover { color: #f8fafc; background-color: rgba(255,255,255,0.08); transform: translateX(5px); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: #fff; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }
        .nav-item.active i { transform: scale(1.1); }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(3px); z-index: 900; }
        .sidebar-overlay.show { display: block; }

        /* MAIN CONTENT & TOPBAR */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; width: 100%; position: relative; }
        .topbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 15px 35px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); gap: 15px; z-index: 500; position: sticky; top: 0; }
        .topbar-left { display: flex; align-items: center; flex: 1; }
        .menu-toggle { display: none; font-size: 22px; cursor: pointer; color: var(--text-main); margin-right: 20px; transition: color 0.2s; }
        .menu-toggle:hover { color: var(--primary-color); }
        
        /* SEARCH BAR */
        .search-container { position: relative; width: 100%; max-width: 450px; display: flex; gap: 12px; align-items: center; }
        .search-bar { background: #f1f5f9; padding: 12px 20px; border-radius: 50px; display: flex; align-items: center; flex: 1; transition: all 0.3s; border: 1px solid transparent; }
        .search-bar:focus-within { background: #fff; border-color: #cbd5e1; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 10px; width: 100%; font-size: 13px; color: var(--text-main); }
        
        .btn-scan-top { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; flex-shrink: 0; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
        .btn-scan-top:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); }

        /* DROPDOWN SEARCH RESULT */
        .search-result-box { position: absolute; top: 110%; left: 0; right: 50px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; z-index: 1000; max-height: 400px; overflow-y: auto; border: 1px solid #e2e8f0; padding: 5px; }
        .search-item { padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; margin-bottom: 2px; }
        .search-item:hover { background: #f8fafc; }
        .item-left { display: flex; align-items: center; gap: 15px; }
        .item-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background-color: #f1f5f9; border: 1px solid #e2e8f0; }
        .item-info h5 { font-size: 14px; margin: 0; color: var(--text-main); font-weight: 600; }
        .item-info p { font-size: 11px; margin: 4px 0 0; }
        .item-price { font-size: 14px; font-weight: 700; color: var(--primary-color); text-align: right; }

        /* USER PROFILE */
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; background: linear-gradient(135deg, #1e293b, #334155); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: background 0.3s; }
        .user-info h4 { font-size: 14px; margin: 0; white-space: nowrap; font-weight: 600; }
        .user-info p { font-size: 11.5px; color: var(--text-muted); margin: 0; }

        /* SCANNER MODAL */
        #scannerModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.9); backdrop-filter: blur(5px); z-index: 99999; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 20px; }
        .scanner-card { background: white; padding: 25px; border-radius: var(--radius-card); width: 100%; max-width: 400px; text-align: center; }
        #readerTop { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 20px; border: none; box-shadow: inset 0 0 0 2px #e2e8f0; }

        /* PAGES */
        .page-content { padding: 35px; display: none; }
        .page-content.active { display: block; animation: slideFadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideFadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* DASHBOARD BANNER */
        .banner { 
            width: 100%; height: 280px; 
            background: url('Complete Phone Accessories Shopping Banner.png'); 
            background-size: cover; background-position: center; 
            border-radius: var(--radius-card); margin-bottom: 30px; 
            box-shadow: 0 15px 35px -10px rgba(0,0,0,0.15); 
        }

        /* STAT CARDS */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 25px; margin-bottom: 35px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: var(--radius-card); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); display: flex; flex-direction: column; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(0,0,0,0.02); }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04); }
        .stat-header { display: flex; align-items: center; gap: 15px; margin-bottom: 18px; pointer-events: none; }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        
        .icon-blue { background: #eff6ff; color: #3b82f6; }
        .icon-purple { background: #faf5ff; color: #a855f7; }
        .icon-orange { background: #fff7ed; color: #f97316; }
        .icon-green { background: #f0fdf4; color: #22c55e; }
        
        .stat-title { font-size: 13.5px; font-weight: 500; color: var(--text-muted); pointer-events: none; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--text-main); pointer-events: none; letter-spacing: -0.5px; }
        
        /* FORM CARDS */
        .form-card { background: var(--card-bg); padding: 35px; border-radius: var(--radius-card); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.02); max-width: 650px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-main); margin-bottom: 8px; font-weight: 600; letter-spacing: 0.3px; }
        .form-control { width: 100%; padding: 14px 18px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-btn); font-size: 14px; color: var(--text-main); outline: none; transition: all 0.2s; }
        .form-control:focus { background-color: #fff; border-color: var(--primary-color); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .form-control::placeholder { color: #94a3b8; }
        
        /* BUTTONS */
        .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-btn); font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: white; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(59, 130, 246, 0.35); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; margin-bottom: 15px; box-shadow: 0 4px 12px rgba(245, 158, 11, 0.25); }
        .btn-warning:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(245, 158, 11, 0.35); }
        
        /* IMAGE PREVIEW & SCANNER BOX */
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; border: 2px dashed #cbd5e1; background: #f8fafc; }
        #previewFoto { width: 100%; max-height: 250px; object-fit: contain; margin-top: 15px; border-radius: 12px; border: 1px solid #e2e8f0; display: none; background: #f1f5f9; padding: 10px; }

        /* RESPONSIVE MOBILE */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .topbar { padding: 15px 20px; }
            .user-info { display: none; }
            .page-content { padding: 20px; }
            .banner { height: 160px; border-radius: 12px; margin-bottom: 20px; }
            .form-card { padding: 25px 20px; }
            .stats-grid { grid-template-columns: 1fr; gap: 15px; }
            .search-container { max-width: 100%; }
        }
    </style>
