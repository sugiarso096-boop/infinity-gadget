<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Gadget v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        :root { --bg-color: #f8fafc; --primary-color: #3b82f6; --primary-hover: #2563eb; --text-main: #1e293b; --text-muted: #64748b; --card-bg: #ffffff; --radius-card: 16px; --radius-btn: 10px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { display: flex; background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }
        ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        #loginModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); z-index: 99999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 40px 30px; border-radius: var(--radius-card); width: 90%; max-width: 400px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); }
        .login-card h3 { margin-bottom: 8px; color: var(--text-main); font-weight: 700; font-size: 22px; }
        .login-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 25px; }

        .sidebar { width: 260px; background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.95)), url('Modern Phone Accessories Showcase.png'); background-size: cover; background-position: left center; color: #fff; display: flex; flex-direction: column; padding: 25px 0; z-index: 1000; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .logo-area { text-align: center; margin-bottom: 45px; padding-top: 15px; }
        .logo-area h2 { color: #fff; font-weight: 800; letter-spacing: 2px; font-size: 28px; line-height: 1.1; }
        .logo-area h2 .icon-infin { display: block; font-size: 55px; margin-bottom: 0px; font-weight: 300; line-height: 0.8; }
        .logo-area h2 .text-gadget { display: block; color: var(--primary-color); font-size: 16px; letter-spacing: 8px; font-weight: 600; margin-top: 4px; padding-left: 8px; }
        
        .menu-title { font-size: 11px; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1.5px; margin: 15px 25px 10px; font-weight: 600; }
        .nav-item { padding: 12px 25px; cursor: pointer; display: flex; align-items: center; color: #cbd5e1; font-size: 14px; transition: all 0.2s ease; margin: 4px 15px; border-radius: var(--radius-btn); font-weight: 500; }
        .nav-item i { width: 28px; font-size: 16px; }
        .nav-item:hover { color: #f8fafc; background-color: rgba(255,255,255,0.15); transform: translateX(5px); }
        .nav-item.active { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: #fff; }

        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.5); backdrop-filter: blur(3px); z-index: 900; }
        .sidebar-overlay.show { display: block; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; position: relative; }
        .topbar { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 15px 35px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.05); gap: 15px; z-index: 500; position: sticky; top: 0; }
        .topbar-left { display: flex; align-items: center; flex: 1; }
        .menu-toggle { display: none; font-size: 22px; cursor: pointer; color: var(--text-main); margin-right: 20px; }
        .search-container { position: relative; width: 100%; max-width: 450px; display: flex; gap: 12px; align-items: center; }
        .search-bar { background: #f1f5f9; padding: 12px 20px; border-radius: 50px; display: flex; align-items: center; flex: 1; }
        .search-bar input { border: none; background: transparent; outline: none; margin-left: 10px; width: 100%; font-size: 13px; color: var(--text-main); }
        .btn-scan-top { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .search-result-box { position: absolute; top: 110%; left: 0; right: 50px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; z-index: 1000; max-height: 400px; overflow-y: auto; padding: 5px; }
        .search-item { padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .item-left { display: flex; align-items: center; gap: 15px; }
        .item-img { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; background-color: #f1f5f9; border: 1px solid #e2e8f0; }

        .user-profile { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 5px 10px; border-radius: 10px; }
        .avatar { width: 42px; height: 42px; background: #1e293b; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
        .user-info h4 { font-size: 14px; margin: 0; white-space: nowrap; font-weight: 600; }
        .user-info p { font-size: 11.5px; color: var(--text-muted); margin: 0; }

        .page-content { padding: 35px; display: none; }
        .page-content.active { display: block; animation: slideFadeUp 0.3s; }
        @keyframes slideFadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .banner { width: 100%; height: 280px; background: url('Complete Phone Accessories Shopping Banner.png') center/cover; border-radius: var(--radius-card); margin-bottom: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 25px; margin-bottom: 35px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: var(--radius-card); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .stat-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .icon-box { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
        .icon-blue { background: #eff6ff; color: #3b82f6; }
        .icon-purple { background: #faf5ff; color: #a855f7; }
        .icon-orange { background: #fff7ed; color: #f97316; }
        .icon-green { background: #f0fdf4; color: #22c55e; }
        .icon-red { background: #fef2f2; color: #ef4444; }
        .stat-title { font-size: 13.5px; font-weight: 500; color: var(--text-muted); }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--text-main); }

        .form-card { background: var(--card-bg); padding: 35px; border-radius: var(--radius-card); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); max-width: 650px; margin: 0 auto; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-main); margin-bottom: 8px; font-weight: 600; }
        .form-control { width: 100%; padding: 14px 18px; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: var(--radius-btn); font-size: 14px; outline: none; }
        .form-control:focus { background-color: #fff; border-color: var(--primary-color); }
        .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-btn); font-size: 15px; font-weight: 600; cursor: pointer; color: white; display: flex; justify-content: center; gap: 8px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-color), var(--primary-hover)); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }
        
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; display: none; }
        #previewFoto { width: 100%; max-height: 250px; object-fit: contain; margin-top: 15px; border-radius: 12px; display: none; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .topbar { padding: 15px 20px; }
            .user-info { display: none; }
            .page-content { padding: 20px; }
            .banner { height: 160px; margin-bottom: 20px; }
            .form-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div id="loginModal">
        <div class="login-card">
            <h3>Infinity Gadget Access</h3>
            <p>Pilih peran Anda untuk masuk ke sistem</p>
            <button class="btn btn-primary" onclick="loginSebagaiKaryawan()" style="margin-bottom: 10px;"><i class="fas fa-user"></i> Masuk Sebagai Karyawan (Kasir)</button>
            <hr style="margin: 15px 0; border:0; border-top:1px solid rgba(0,0,0,0.05);">
            <div class="form-group" style="text-align: left;"><label>PIN Owner:</label><input type="password" id="inputPin" class="form-control" placeholder="Masukkan PIN..."></div>
            <button class="btn btn-warning" onclick="loginSebagaiOwner()"><i class="fas fa-lock"></i> Masuk Sebagai Owner</button>
            <p id="loginError" style="color: #ef4444; font-size: 13px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar">
        <div class="logo-area"><h2><span class="icon-infin">&infin;</span>INFINITY<span class="text-gadget">GADGET</span></h2></div>
        <div class="menu-title">Menu Utama</div>
        <div class="nav-item active" onclick="switchPage('dashboard', this)"><i class="fas fa-home"></i> Dashboard</div>
        <div class="nav-item" onclick="switchPage('kasir', this)"><i class="fas fa-shopping-cart"></i> Kasir & Input</div>
        <div class="menu-title" id="titleOwner" style="display:none;">Menu Owner</div>
        <div class="nav-item" id="menuEditBarang" style="display:none;" onclick="switchPage('edit', this)"><i class="fas fa-edit"></i> Kelola & Edit Stok</div>
    </div>

    <div class="main-content">
        <!-- TOPBAR -->
        <div class="topbar">
            <div class="topbar-left">
                <i class="fas fa-bars menu-toggle" onclick="toggleSidebar()"></i>
                <div class="search-container">
                    <div class="search-bar">
                        <i class="fas fa-search" style="color:#94a3b8;"></i>
                        <input type="text" id="searchInput" placeholder="Cek Stok & Harga..." onkeyup="cariBarang(event)">
                    </div>
                </div>
            </div>
            <div class="user-profile" onclick="bukaMenuLogin()">
                <div class="avatar" id="userAvatar">AD</div>
                <div class="user-info"><h4 id="userName">Admin / Kasir</h4><p id="userRole">Infinity Gadget</p></div>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page-content active">
            <div class="banner"></div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-header"><div class="icon-box icon-blue"><i class="fas fa-shopping-bag"></i></div><div class="stat-title">Total Penjualan</div></div><div class="stat-value" id="angka-penjualan">...</div></div>
                <div class="stat-card"><div class="stat-header"><div class="icon-box icon-purple"><i class="fas fa-box"></i></div><div class="stat-title">Total Produk</div></div><div class="stat-value" id="angka-produk">...</div></div>
                <div class="stat-card"><div class="stat-header"><div class="icon-box icon-orange"><i class="fas fa-tags"></i></div><div class="stat-title">Kategori</div></div><div class="stat-value" id="angka-kategori">...</div></div>
                <div class="stat-card"><div class="stat-header"><div class="icon-box icon-red"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-title">Harga Kosong</div></div><div class="stat-value" id="angka-belum-set">...</div></div>
            </div>
        </div>

        <!-- HALAMAN KASIR & INPUT -->
        <div id="page-kasir" class="page-content">
            <div class="form-card">
                <!-- TULISAN V3 AGAR ANDA TAHU KODE BARU BERJALAN -->
                <h3 style="margin-bottom: 25px; color: var(--text-main); font-weight: 700;">Input Barang <span style="font-size:13px; color:var(--primary-color);">(Auto-Save v3)</span></h3>
                
                <form id="formKaryawan" onsubmit="kirimData(event)">
                    <div class="form-group">
                        <label>Jenis Input</label>
                        <select name="tipeForm" id="tipeForm" class="form-control" onchange="aturForm()">
                            <option value="penjualan">Kasir - Penjualan</option>
                            <option value="barang_masuk">Gudang - Barang Masuk</option>
                        </select>
                    </div>

                    <div class="form-group"><label>Nama Karyawan</label><input type="text" id="kasir" name="kasir" class="form-control" required></div>
                    <div class="form-group"><label>Barcode / IMEI</label><input type="text" id="barcode" name="barcode" class="form-control" placeholder="Scan / Ketik Barcode"></div>
                    <div class="form-group"><label>Nama Barang / Tipe HP</label><input type="text" id="barang" name="barang" class="form-control" required></div>
                    
                    <div class="form-group" id="divKategori" style="display:none;">
                        <label>Kategori</label>
                        <input type="text" id="kategori" name="kategori" class="form-control" list="pilihanKategori">
                        <datalist id="pilihanKategori"><option value="TWS"><option value="Powerbank"><option value="LCD"></datalist>
                    </div>

                    <div class="form-group"><label>Jumlah (Qty)</label><input type="number" id="qty" name="qty" class="form-control" value="1" required></div>
                    <div class="form-group" id="divHargaModal" style="display:none;"><label>Harga Modal</label><input type="number" id="hargaModal" name="hargaModal" class="form-control" value="0"></div>
                    <div class="form-group" id="divHargaJualInput" style="display:none;"><label>Harga Jual</label><input type="number" id="hargaJualInput" name="hargaJualInput" class="form-control" value="0"></div>
                    <div class="form-group" id="divTotalJual"><label>Total Penjualan</label><input type="number" id="totalJual" name="totalJual" class="form-control" value="0"></div>

                    <div class="form-group" id="divFoto" style="display:none;">
                        <label>Upload Foto Fisik</label>
                        <input type="file" id="inputFoto" class="form-control" accept="image/*">
                        <img id="previewFoto" src="" alt="Preview">
                    </div>

                    <button type="submit" id="btnSubmit" class="btn btn-primary" style="margin-top: 10px;"><i class="fas fa-save"></i> Simpan Data</button>
                </form>
                <p id="status" style="text-align: center; margin-top: 15px; color: #10b981; font-weight: 600;"></p>
            </div>
        </div>

        <!-- KELOLA EDIT -->
        <div id="page-edit" class="page-content">
            <div class="form-card" style="max-width: 800px;">
                <h3 style="margin-bottom: 25px;">Kelola Stok</h3>
                <div class="form-group"><input type="text" id="searchEditInput" class="form-control" placeholder="Cari barang..." onkeyup="filterTabelBarang()"></div>
                <div id="editResultList" style="max-height: 400px; overflow-y: auto;"></div>
                
                <form id="formEditBarang" onsubmit="simpanPerubahanBarang(event)" style="display:none; border-top: 2px dashed #eee; margin-top: 25px; padding-top: 25px;">
                    <input type="hidden" id="editRow" name="rowEdit">
                    <div class="form-group"><label>Nama Barang</label><input type="text" id="editNama" name="barang" class="form-control" required></div>
                    <div class="form-group"><label>Kategori</label><input type="text" id="editKategori" name="kategori" class="form-control" required></div>
                    <div class="form-group"><label>Sisa Stok</label><input type="number" id="editStok" name="qty" class="form-control" required></div>
                    <div class="form-group"><label>Harga Jual</label><input type="number" id="editHargaJual" name="hargaJualInput" class="form-control" required></div>
                    <div class="form-group"><label>Harga Modal</label><input type="number" id="editHargaModal" name="hargaModal" class="form-control" required></div>
                    <div class="form-group"><label>Barcode</label><input type="text" id="editBarcode" name="barcode" class="form-control"></div>
                    <div style="display: flex; gap: 12px;">
                        <button type="submit" id="btnUpdate" class="btn btn-primary" style="flex:2;">Simpan</button>
                        <button type="button" class="btn" style="background:#e2e8f0; color:#000; flex:1;" onclick="batalEdit()">Batal</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxBXAryBPE81DmRCFtliQmGIq2Xx3K4olGOQurn_GQL7K2cBvkYqFL2lxenx3X4Jy9s/exec';
        const PIN_RAHASIA = '1234';
        let statusRole = 'karyawan';
        let cacheDataEdit = [];

        function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('show'); document.querySelector('.sidebar-overlay').classList.toggle('show'); }
        function switchPage(pageId, element) { document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active')); document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active')); document.getElementById('page-' + pageId).classList.add('active'); if(element) element.classList.add('active'); if(pageId === 'edit') muatSemuaBarangUntukEdit(); }
        
        function bukaMenuLogin() { document.getElementById('loginModal').style.display = 'flex'; }
        function loginSebagaiKaryawan() { statusRole = 'karyawan'; document.getElementById('loginModal').style.display = 'none'; document.getElementById('userAvatar').innerText = 'AD'; document.getElementById('cardAset').style.display = 'none'; document.getElementById('titleOwner').style.display = 'none'; document.getElementById('menuEditBarang').style.display = 'none'; }
        function loginSebagaiOwner() { if(document.getElementById('inputPin').value === PIN_RAHASIA) { statusRole = 'owner'; document.getElementById('loginModal').style.display = 'none'; document.getElementById('userAvatar').innerText = 'OW'; document.getElementById('cardAset').style.display = 'flex'; document.getElementById('titleOwner').style.display = 'block'; document.getElementById('menuEditBarang').style.display = 'flex'; } else { document.getElementById('loginError').innerText = 'PIN Salah!'; } }

        function muatDataDashboard() {
            fetch(scriptURL).then(r=>r.json()).then(data=>{
                document.getElementById('angka-penjualan').innerHTML = "Rp " + data.penjualan; document.getElementById('angka-produk').innerHTML = data.produk; document.getElementById('angka-kategori').innerHTML = data.kategoriCount; document.getElementById('angka-aset').innerHTML = "Rp " + data.aset;
            });
        }
        window.onload = muatDataDashboard;

        function formatGambarDrive(url) {
            if(!url || url === "") return "https://via.placeholder.com/45x45/f1f5f9/94a3b8?text=No+Foto";
            let match = url.match(/\/d\/(.+?)\//);
            if(match && match[1]) { return "https://lh3.googleusercontent.com/d/" + match[1]; }
            return url;
        }

        function muatSemuaBarangToTabel(data) {
            cacheDataEdit = data; let html = "";
            data.forEach((item, i) => {
                html += `<div style="padding:10px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                    <div><b>${item.nama}</b><br><small>Stok: ${item.stok} | Rp ${item.hargaJual}</small></div>
                    <div style="cursor:pointer; color:blue;" onclick="pilihBarangEdit(${i})"><i class="fas fa-edit"></i> Edit</div>
                </div>`;
            });
            document.getElementById("editResultList").innerHTML = html;
        }
        function muatSemuaBarangUntukEdit() { fetch(scriptURL + "?action=search&keyword=").then(r=>r.json()).then(d=>muatSemuaBarangToTabel(d)); }
        function filterTabelBarang() { let kw = document.getElementById("searchEditInput").value.toLowerCase(); muatSemuaBarangToTabel(cacheDataEdit.filter(i=>i.nama.toLowerCase().includes(kw))); }
        function pilihBarangEdit(i) { let item = cacheDataEdit[i]; document.getElementById("editRow").value = item.row; document.getElementById("editNama").value = item.nama; document.getElementById("editKategori").value = item.kategori; document.getElementById("editStok").value = item.stok; document.getElementById("editHargaJual").value = item.hargaJual; document.getElementById("editHargaModal").value = item.hargaModal; document.getElementById("editBarcode").value = item.barcode; document.getElementById("formEditBarang").style.display = "block"; }
        function batalEdit() { document.getElementById("formEditBarang").style.display = "none"; }

        // ========================================================
        // PENGIRIMAN FORMDATA (100% KOMPATIBEL DENGAN GOOGLE LAMA)
        // ========================================================
        function simpanPerubahanBarang(e) {
            e.preventDefault();
            let btn = document.getElementById("btnUpdate");
            btn.innerHTML = "Menyimpan...";
            
            let form = document.getElementById("formEditBarang");
            let formData = new FormData(form);
            formData.set("tipeForm", "edit_barang");

            fetch(scriptURL, { method: 'POST', body: formData }).then(r=>r.text()).then(res=>{ alert(res); document.getElementById("formEditBarang").style.display = "none"; muatSemuaBarangUntukEdit(); btn.innerHTML = "Simpan"; });
        }

        let fileB64 = "", mimeType = "", namaFile = "";

        function aturForm() {
            let tipe = document.getElementById("tipeForm").value;
            if(tipe === "barang_masuk") {
                document.getElementById("divTotalJual").style.display = "none"; document.getElementById("divHargaJualInput").style.display = "block"; document.getElementById("divKategori").style.display = "block"; document.getElementById("divFoto").style.display = "block";
                if(statusRole === 'owner') document.getElementById("divHargaModal").style.display = "block";
            } else {
                document.getElementById("divTotalJual").style.display = "block"; document.getElementById("divHargaJualInput").style.display = "none"; document.getElementById("divKategori").style.display = "none"; document.getElementById("divFoto").style.display = "none"; document.getElementById("divHargaModal").style.display = "none";
            }
        }

        // ========================================================
        // KUNCI PENGAMAN FOTO (GEMBOK PINTAR)
        // ========================================================
        document.getElementById("inputFoto").addEventListener("change", function(e) {
            let file = e.target.files[0];
            let btnSubmit = document.getElementById("btnSubmit");
            
            if(file) {
                btnSubmit.disabled = true;
                btnSubmit.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Memproses Foto, Tunggu...";
                btnSubmit.style.background = "#94a3b8";

                namaFile = "compressed_" + file.name; 
                mimeType = "image/jpeg"; 

                let reader = new FileReader();
                reader.onload = function(event) {
                    let img = new Image();
                    img.onload = function() {
                        const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
                        let width = img.width, height = img.height;
                        if (width > height) { if (width > MAX_WIDTH) { height = Math.round((height *= MAX_WIDTH / width)); width = MAX_WIDTH; }
                        } else { if (height > MAX_HEIGHT) { width = Math.round((width *= MAX_HEIGHT / height)); height = MAX_HEIGHT; } }
                        
                        let canvas = document.createElement("canvas");
                        canvas.width = width; canvas.height = height;
                        let ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        let compressedDataUrl = canvas.toDataURL("image/jpeg", 0.6);
                        fileB64 = compressedDataUrl.split(',')[1];
                        
                        document.getElementById("previewFoto").src = compressedDataUrl;
                        document.getElementById("previewFoto").style.display = "block";

                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = "<i class='fas fa-save'></i> Simpan Data";
                        btnSubmit.style.background = "linear-gradient(135deg, var(--primary-color), var(--primary-hover))";
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // ========================================================
        // KEMBALI KE METODE FORMDATA AMAN!
        // ========================================================
        function kirimData(e) {
            e.preventDefault();
            
            let fotoInput = document.getElementById("inputFoto");
            let tipe = document.getElementById("tipeForm").value;

            if(tipe === "barang_masuk" && fotoInput.files.length > 0 && fileB64 === "") {
                alert("Foto masih diproses oleh sistem. Mohon tunggu 1 detik lagi!");
                return;
            }

            let btn = document.getElementById("btnSubmit");
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Menyimpan ke Database...";
            btn.disabled = true;

            let form = document.getElementById("formKaryawan");
            let formData = new FormData(form);
            
            let inputKategori = document.getElementById("kategori").value;
            formData.set("kategori", inputKategori.trim() === "" ? "Lainnya" : inputKategori);
            
            if(statusRole === 'karyawan') { formData.set("hargaModal", 0); }
            
            // Masukkan sandi foto yang sudah dikompres dengan aman
            formData.set("fotoB64", fileB64);
            formData.set("mimeType", mimeType);
            formData.set("namaFile", namaFile);

            // JALUR LAMA YANG PASTI BERHASIL
            fetch(scriptURL, { 
                method: 'POST',
                body: formData 
            })
            .then(response => response.text())
            .then(result => {
                document.getElementById("status").innerText = result;
                document.getElementById("formKaryawan").reset(); 
                fileB64 = ""; aturForm();
                document.getElementById("previewFoto").style.display = "none";
                btn.innerHTML = "<i class='fas fa-save'></i> Simpan Data";
                btn.disabled = false;
                muatDataDashboard();
            })
            .catch(error => {
                document.getElementById("status").innerText = "Gagal mengirim jaringan sibuk.";
                btn.innerHTML = "<i class='fas fa-save'></i> Simpan Data";
                btn.disabled = false;
            });
        }
    </script>
</body>
