<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Gadget - Kasir & Servis</title>
    <!-- Bootstrap 5 CSS CDN (Lebih stabil dan pasti jalan) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Header / Navbar -->
    <nav class="navbar navbar-dark bg-dark shadow-sm px-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold text-info">INFINITY GADGET <small class="text-muted fs-6">Kasir v2.0</small></span>
            <span class="badge bg-success">Bot Telegram: Online</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container my-4">
        <div class="row g-4">
            
            <!-- KOLOM KIRI: Input Transaksi -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="fw-bold text-secondary mb-3">🛒 Input Transaksi</h5>
                    
                    <div class="mb-3">
                        <label class="form-label small text-muted">Cari Barcode / Nama Barang</label>
                        <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Ketik nama barang...">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small text-muted">Kategori</label>
                        <div class="btn-group w-100" role="group">
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="pilihKategori('Pulsa')">Pulsa</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="pilihKategori('Servis')">Servis</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="pilihKategori('LCD')">LCD</button>
                        </div>
                    </div>

                    <div class="bg-white border rounded p-3 mb-3">
                        <small class="text-muted">Produk Terpilih:</small>
                        <div id="selectedProduct" class="fw-bold text-dark">- Belum dipilih -</div>
                        <div id="selectedPrice" class="text-primary fw-semibold small mb-2">Rp 0</div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">Jumlah:</small>
                            <div class="input-group input-group-sm w-50">
                                <button class="btn btn-outline-secondary" onclick="ubahQty(-1)">-</button>
                                <span id="qtyVal" class="form-control text-center bg-white">1</span>
                                <button class="btn btn-outline-secondary" onclick="ubahQty(1)">+</button>
                            </div>
                        </div>
                    </div>

                    <button onclick="tambahKeKeranjang()" class="btn btn-primary btn-sm w-100 fw-bold py-2">
                        + Tambah ke Keranjang
                    </button>
                </div>
            </div>

            <!-- KOLOM KANAN: Keranjang & Laporan Telegram -->
            <div class="col-lg-8">
                <!-- Keranjang Belanja -->
                <div class="card shadow-sm border-0 p-3 mb-4">
                    <h5 class="fw-bold text-secondary mb-3">📦 Keranjang Belanja</h5>
                    <div class="table-responsive">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr class="text-muted small">
                                    <th>Barang</th>
                                    <th class="text-center">Qty</th>
                                    <th class="text-end">Harga</th>
                                    <th class="text-end">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody id="cartTableBody">
                                <tr>
                                    <td colspan="4" class="text-center text-muted fst-italic py-3">Keranjang masih kosong</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="border-top pt-3 mt-2">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <span class="fw-bold fs-5">TOTAL:</span>
                            <span id="grandTotal" class="fw-bold text-primary fs-4">Rp 0</span>
                        </div>
                        <div class="row g-2">
                            <div class="col-sm-6">
                                <button onclick="prosesBayar()" class="btn btn-success btn-sm w-100 fw-bold py-2">💳 Bayar & Simpan</button>
                            </div>
                            <div class="col-sm-6">
                                <button onclick="cetakStruk()" class="btn btn-dark btn-sm w-100 fw-bold py-2">🖨️ Cetak Struk Thermal</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Kontrol Telegram -->
                <div class="card shadow-sm border-0 p-3">
                    <h5 class="fw-bold text-secondary mb-3">⚡ Laporan & Kontrol Cepat (Telegram)</h5>
                    <div class="row g-2">
                        <div class="col-md-4">
                            <button onclick="kirimLaporanTelegram('rekap')" class="btn btn-outline-primary btn-sm w-100 py-2">📊 Kirim Rekap Harian</button>
                        </div>
                        <div class="col-md-4">
                            <button onclick="kirimLaporanTelegram('stok')" class="btn btn-outline-warning btn-sm w-100 py-2">📦 Cek Stok LCD</button>
                        </div>
                        <div class="col-md-4">
                            <button onclick="kirimLaporanTelegram('servis')" class="btn btn-outline-info btn-sm w-100 py-2">📝 Data Servis Masuk</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center py-3 text-muted small">
        &copy; 2026 Infinity Gadget. All rights reserved.
    </footer>

    <!-- Bootstrap JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgp_pzUFcer6xnCOwUs9b0dzwWCkFc9fEc7ntB8C5sPiPL1Xz69xgRX2M_0Ull65Ls9w/exec";

        let currentQty = 1;

        function ubahQty(nilai) {
            currentQty += nilai;
            if (currentQty < 1) currentQty = 1;
            document.getElementById('qtyVal').innerText = currentQty;
        }

        function pilihKategori(kategori) {
            document.getElementById('selectedProduct').innerText = "Contoh Produk " + kategori;
            document.getElementById('selectedPrice').innerText = "Rp 150.000";
        }

        function tambahKeKeranjang() {
            alert("Fitur keranjang aktif.");
        }

        function prosesBayar() {
            alert("Transaksi berhasil disimpan!");
        }

        function cetakStruk() {
            window.print();
        }

        function kirimLaporanTelegram(jenis) {
            alert("Mengirim laporan " + jenis + " ke Telegram...");
        }
    </script>
</body>
</html>
