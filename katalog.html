<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Infinity Gadget - Katalog Resmi</title>

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    background:#fff;
    color:#111827;
}

button,
input{
    font-family:inherit;
}

a{
    text-decoration:none;
    color:inherit;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar{
    background:#101827;
    color:white;
    padding:9px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
}

.topbar-right{
    display:flex;
    gap:20px;
}


/* =====================================================
   HEADER
===================================================== */

.header{
    height:88px;
    background:white;
    border-bottom:1px solid #e5e7eb;

    display:flex;
    align-items:center;

    padding:0 5%;
    gap:35px;

    position:sticky;
    top:0;

    z-index:1000;
}

.logo{
    font-size:27px;
    font-weight:800;

    white-space:nowrap;

    display:flex;
    align-items:center;
    gap:8px;
}

.logo-infinity{
    color:#ed0b24;
    font-size:45px;
    line-height:1;
}

.logo-text{
    color:#111827;
}

.logo-text span{
    color:#ed0b24;
}


/* =====================================================
   NAV
===================================================== */

.nav{
    display:flex;
    gap:8px;
    align-items:center;
}

.nav a{
    padding:14px 18px;
    border-radius:14px;

    font-weight:600;

    transition:.2s;
}

.nav a:hover,
.nav a.active{
    background:#ed0b24;
    color:white;
}


/* =====================================================
   SEARCH
===================================================== */

.header-search{
    margin-left:auto;
    width:360px;
    position:relative;
}

.header-search i{
    position:absolute;

    left:17px;
    top:50%;

    transform:translateY(-50%);

    color:#64748b;
}

.header-search input{
    width:100%;
    height:48px;

    border:1px solid #dbe2ea;
    border-radius:15px;

    padding:0 15px 0 48px;

    outline:none;

    font-size:14px;

    background:#f8fafc;
}

.header-search input:focus{
    border-color:#ed0b24;
    background:white;
}


/* =====================================================
   HEADER ACTION
===================================================== */

.header-actions{
    display:flex;
    gap:20px;
    align-items:center;
}

.action-icon{
    position:relative;

    font-size:22px;

    cursor:pointer;
}

.cart-badge{
    position:absolute;

    top:-10px;
    right:-10px;

    width:21px;
    height:21px;

    border-radius:50%;

    background:#ed0b24;
    color:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:11px;
    font-weight:700;
}


/* =====================================================
   HERO DESKTOP
===================================================== */

.hero{
    width:90%;
    max-width:1450px;

    margin:24px auto;

    min-height:390px;

    border-radius:25px;

    overflow:hidden;

    position:relative;

    background-image:url('robot.png');

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    display:flex;
    align-items:center;
}

.hero-overlay{
    position:absolute;

    inset:0;

    background:
    linear-gradient(
        90deg,
        rgba(255,255,255,.97) 0%,
        rgba(255,255,255,.88) 35%,
        rgba(255,255,255,.20) 70%,
        rgba(255,255,255,0) 100%
    );
}

.hero-content{
    position:relative;

    z-index:2;

    width:50%;

    padding:50px;
}

.hero-small{
    color:#ed0b24;

    font-size:14px;
    font-weight:700;

    margin-bottom:8px;
}

.hero h1{
    font-size:46px;

    line-height:1.1;

    margin-bottom:15px;

    color:#111827;
}

.hero h1 span{
    color:#ed0b24;
}

.hero p{
    color:#475569;

    line-height:1.7;

    margin-bottom:25px;

    max-width:520px;
}

.btn-primary{
    border:0;

    background:#ed0b24;
    color:white;

    padding:14px 25px;

    border-radius:13px;

    font-size:15px;
    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.btn-primary:hover{
    background:#c9001d;

    transform:translateY(-2px);
}

.hero-features{
    display:flex;

    gap:20px;

    margin-top:25px;

    flex-wrap:wrap;
}

.hero-feature{
    display:flex;

    gap:8px;

    align-items:center;

    font-size:12px;
    font-weight:600;
}

.hero-feature i{
    color:#ed0b24;
}


/* =====================================================
   KATEGORI
===================================================== */

.categories{
    width:90%;
    max-width:1450px;

    margin:25px auto;

    display:flex;

    gap:18px;

    overflow-x:auto;

    padding:5px 5px 12px;
}

.categories::-webkit-scrollbar{
    height:5px;
}

.categories::-webkit-scrollbar-thumb{
    background:#ddd;
    border-radius:10px;
}

.category{
    min-width:115px;

    text-align:center;

    cursor:pointer;
}

.category-icon{
    width:80px;
    height:80px;

    margin:auto;

    border-radius:50%;

    border:1px solid #e2e8f0;

    background:#f8fafc;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:25px;

    color:#111827;

    transition:.2s;
}

.category:hover .category-icon,
.category.active .category-icon{
    background:#fff1f2;

    border-color:#ed0b24;

    color:#ed0b24;
}

.category-name{
    margin-top:10px;

    font-size:14px;
    font-weight:700;
}

.category-count{
    font-size:11px;

    color:#64748b;

    margin-top:4px;
}


/* =====================================================
   HIGHLIGHT
===================================================== */

.highlights{
    width:90%;
    max-width:1450px;

    margin:10px auto 35px;

    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:14px;
}

.highlight{
    background:#fff5f6;

    border:1px solid #ffd9de;

    border-radius:17px;

    padding:18px;

    display:flex;

    align-items:center;

    gap:15px;
}

.highlight i{
    color:#ed0b24;

    font-size:28px;
}

.highlight strong{
    display:block;

    font-size:14px;
}

.highlight span{
    color:#64748b;

    font-size:12px;
}


/* =====================================================
   SECTION
===================================================== */

.section{
    width:90%;
    max-width:1450px;

    margin:45px auto;
}

.section-title{
    display:flex;

    justify-content:space-between;
    align-items:center;

    margin-bottom:20px;
}

.title-left{
    display:flex;

    align-items:center;

    gap:12px;
}

.title-line{
    width:6px;
    height:31px;

    background:#ed0b24;

    border-radius:5px;
}

.section-title h2{
    font-size:27px;
}

.see-all{
    color:#ed0b24;

    font-weight:700;

    font-size:14px;

    cursor:pointer;
}


/* =====================================================
   PRODUCT GRID
===================================================== */

.product-grid{
    display:grid;

    grid-template-columns:repeat(5,1fr);

    gap:16px;

    align-items:stretch;
}


/* =====================================================
   PRODUCT CARD
===================================================== */

.product-card{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:17px;

    overflow:hidden;

    transition:.25s;

    position:relative;

    display:flex;

    flex-direction:column;

    height:100%;

    min-height:535px;
}

.product-card:hover{
    transform:translateY(-5px);

    box-shadow:
    0 15px 35px rgba(15,23,42,.12);
}


/* =====================================================
   PRODUCT IMAGE
===================================================== */

.product-image{
    height:245px;

    flex-shrink:0;

    background:#f8fafc;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.product-image img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    padding:15px;
}


/* =====================================================
   STOCK BADGE
===================================================== */

.stock-badge{
    position:absolute;

    left:12px;
    top:12px;

    z-index:2;

    color:white;

    padding:6px 11px;

    border-radius:8px;

    font-size:11px;

    font-weight:700;
}


/* =====================================================
   PRODUCT INFO
===================================================== */

.product-info{
    padding:15px;

    display:flex;

    flex-direction:column;

    flex:1;
}


/* =====================================================
   PRODUCT NAME
===================================================== */

.product-name{
    font-size:14px;

    font-weight:700;

    line-height:1.45;

    display:-webkit-box;

    -webkit-box-orient:vertical;

    -webkit-line-clamp:2;

    overflow:hidden;

    text-overflow:ellipsis;

    height:41px;

    min-height:41px;
}


/* =====================================================
   PRODUCT CATEGORY
===================================================== */

.product-category{
    color:#94a3b8;

    font-size:11px;

    margin-top:6px;

    height:18px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =====================================================
   RATING
===================================================== */

.rating{
    color:#f59e0b;

    font-size:13px;

    margin-top:7px;

    height:21px;

    display:flex;

    align-items:center;
}

.rating span{
    color:#64748b;

    margin-left:4px;
}


/* =====================================================
   PRICE
===================================================== */

.price{
    color:#ed0b24;

    font-size:20px;

    font-weight:800;

    margin-top:7px;

    height:30px;

    display:flex;

    align-items:center;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* =====================================================
   STOCK
===================================================== */

.stock{
    color:#64748b;

    font-size:11px;

    margin-top:2px;

    height:18px;
}


/* =====================================================
   PRODUCT BUTTON
===================================================== */

.product-buttons{
    display:flex;

    gap:7px;

    margin-top:auto;

    padding-top:12px;
}

.product-buttons button{
    flex:1;

    border:0;

    border-radius:9px;

    height:42px;

    padding:10px 5px;

    font-size:11px;

    font-weight:700;

    cursor:pointer;
}

.btn-buy{
    background:#ed0b24;

    color:white;
}

.btn-detail{
    background:#f1f5f9;

    color:#111827;
}

.btn-buy:hover{
    background:#c9001d;
}

.btn-detail:hover{
    background:#e2e8f0;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
    grid-column:1/-1;

    padding:60px;

    text-align:center;

    color:#64748b;
}

.loading i{
    font-size:35px;

    color:#ed0b24;

    margin-bottom:12px;
}


/* =====================================================
   PROMO
===================================================== */

.promo-grid{
    display:grid;

    grid-template-columns:repeat(3,1fr);

    gap:18px;
}

.promo{
    min-height:170px;

    border-radius:20px;

    padding:25px;

    position:relative;

    overflow:hidden;

    background:#101827;

    color:white;
}

.promo:nth-child(2){
    background:#ed0b24;
}

.promo:nth-child(3){
    background:#f8fafc;

    color:#111827;

    border:1px solid #e5e7eb;
}

.promo h3{
    font-size:20px;

    margin-bottom:8px;
}

.promo p{
    font-size:12px;

    opacity:.85;

    max-width:280px;
}

.promo i{
    position:absolute;

    right:25px;
    bottom:20px;

    font-size:60px;

    opacity:.15;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
    display:none;

    position:fixed;

    inset:0;

    background:rgba(15,23,42,.7);

    z-index:2000;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:900px;

    max-width:100%;

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:22px;

    padding:25px;

    position:relative;
}

.close-modal{
    position:absolute;

    right:20px;
    top:15px;

    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:#f1f5f9;

    cursor:pointer;

    font-size:20px;

    z-index:5;
}

.detail-content{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:30px;
}

.detail-image{
    min-height:420px;

    background:#f8fafc;

    border-radius:18px;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.detail-image img{
    width:100%;
    height:100%;

    max-height:450px;

    object-fit:contain;

    padding:25px;
}

.detail-info{
    padding:25px 10px;
}

.detail-info h2{
    font-size:25px;

    margin-bottom:12px;

    line-height:1.4;
}

.detail-price{
    color:#ed0b24;

    font-size:28px;

    font-weight:800;

    margin:15px 0;
}

.detail-stock{
    color:#64748b;

    margin-bottom:20px;
}

.detail-specs{
    margin:20px 0;
}

.detail-specs div{
    display:flex;

    justify-content:space-between;

    border-bottom:1px solid #e5e7eb;

    padding:10px 0;

    font-size:13px;

    gap:15px;
}


/* =====================================================
   WHATSAPP FLOAT
===================================================== */

.whatsapp-float{
    position:fixed;

    right:25px;
    bottom:25px;

    background:#16c66b;

    color:white;

    padding:14px 20px;

    border-radius:40px;

    display:flex;

    align-items:center;

    gap:9px;

    font-weight:700;

    font-size:13px;

    box-shadow:
    0 8px 25px rgba(0,0,0,.2);

    z-index:1500;

    cursor:pointer;
}

.whatsapp-float i{
    font-size:22px;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    background:#101827;

    color:white;

    margin-top:70px;

    padding:50px 5% 30px;
}

.footer-grid{
    max-width:1450px;

    margin:auto;

    display:grid;

    grid-template-columns:2fr 1fr 1fr 1.5fr;

    gap:40px;
}

.footer h3{
    margin-bottom:15px;
}

.footer p,
.footer a{
    color:#cbd5e1;

    font-size:13px;

    line-height:1.8;
}

.footer a{
    display:block;
}

.footer a:hover{
    color:white;
}

.footer-bottom{
    max-width:1450px;

    margin:35px auto 0;

    padding-top:20px;

    border-top:1px solid #293548;

    color:#94a3b8;

    text-align:center;

    font-size:12px;
}


/* =====================================================
   MOBILE NAV
===================================================== */

.mobile-nav{
    display:none;
}


/* =====================================================
   ERROR
===================================================== */

.error-box{
    grid-column:1/-1;

    background:#fff1f2;

    border:1px solid #fecdd3;

    color:#be123c;

    padding:25px;

    border-radius:15px;

    text-align:center;
}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:1200px){

    .product-grid{
        grid-template-columns:repeat(4,1fr);
    }

    .header-search{
        width:280px;
    }

}


/* =====================================================
   TABLET
===================================================== */

@media(max-width:900px){

    .topbar{
        display:none;
    }

    .header{
        height:70px;

        padding:0 20px;

        gap:15px;
    }

    .logo{
        font-size:19px;
    }

    .logo-infinity{
        font-size:32px;
    }

    .nav{
        display:none;
    }

    .header-search{
        width:auto;

        flex:1;
    }

    .header-search input{
        height:42px;
    }

    .header-actions{
        gap:12px;
    }

    .hero{
        width:94%;

        min-height:400px;

        margin:15px auto;

        background-position:center right;
    }

    .hero-content{
        width:65%;

        padding:30px;
    }

    .hero h1{
        font-size:34px;
    }

    .highlights{
        grid-template-columns:repeat(2,1fr);

        width:94%;
    }

    .section,
    .categories{
        width:94%;
    }

    .product-grid{
        grid-template-columns:repeat(3,1fr);
    }

    .promo-grid{
        grid-template-columns:1fr;
    }

    .footer-grid{
        grid-template-columns:1fr 1fr;
    }

}


/* =====================================================
   HP
   PERBAIKAN KHUSUS TAMPILAN MOBILE
===================================================== */

@media(max-width:600px){

    body{
        padding-bottom:70px;

        overflow-x:hidden;
    }


    /* ===============================
       HEADER HP
    =============================== */

    .header{
        height:72px;

        padding:0 14px;

        gap:10px;
    }

    .logo{
        width:38px;

        flex-shrink:0;

        justify-content:center;
    }

    .logo-infinity{
        font-size:38px;
    }

    .logo-text{
        display:none;
    }

    .header-search{
        width:auto;

        flex:1;

        min-width:0;

        margin:0;
    }

    .header-search i{
        left:14px;
    }

    .header-search input{
        width:100%;

        height:46px;

        border-radius:24px;

        padding-left:43px;
        padding-right:10px;

        font-size:13px;

        white-space:nowrap;

        overflow:hidden;

        text-overflow:ellipsis;
    }

    .header-actions{
        flex-shrink:0;

        gap:0;
    }

    .header-actions .action-icon:first-child{
        display:none;
    }

    .header-actions .action-icon{
        font-size:25px;
    }


    /* ===============================
       HERO HP
    =============================== */

    .hero{
        width:94%;

        height:430px;

        min-height:430px;

        max-height:430px;

        margin:18px auto 20px;

        border-radius:22px;

        align-items:flex-start;

        background-position:center bottom;

        background-size:auto 100%;
    }


    /*
       Overlay lebih kuat supaya
       tulisan tidak bercampur dengan gambar
    */

    .hero-overlay{
        background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.98) 0%,
            rgba(255,255,255,.94) 38%,
            rgba(255,255,255,.65) 61%,
            rgba(255,255,255,.10) 100%
        );
    }


    .hero-content{
        width:100%;

        padding:38px 28px 20px;

        text-align:left;
    }


    .hero-small{
        font-size:12px;

        margin-bottom:7px;
    }


    .hero h1{
        font-size:34px;

        line-height:1.08;

        margin-bottom:14px;
    }


    .hero p{
        font-size:12px;

        line-height:1.65;

        max-width:310px;

        margin-bottom:18px;

        color:#475569;
    }


    .hero .btn-primary{
        padding:13px 20px;

        font-size:13px;

        border-radius:12px;
    }


    /*
       FITUR DI BANNER DISEMBUNYIKAN
       SUPAYA TIDAK BERTABRAKAN
    */

    .hero-features{
        display:none;
    }


    /* ===============================
       WHATSAPP FLOAT HP
    =============================== */

    .whatsapp-float{
        right:15px;

        bottom:82px;

        padding:12px 17px;

        font-size:12px;

        border-radius:30px;

        z-index:1350;
    }

    .whatsapp-float i{
        font-size:20px;
    }


    /* ===============================
       KATEGORI HP
    =============================== */

    .categories{
        width:94%;

        margin:20px auto;

        gap:12px;

        padding-bottom:8px;
    }

    .category{
        min-width:82px;
    }

    .category-icon{
        width:62px;
        height:62px;

        font-size:20px;
    }

    .category-name{
        font-size:10px;

        margin-top:7px;
    }

    .category-count{
        font-size:9px;
    }


    /* ===============================
       HIGHLIGHT HP
    =============================== */

    .highlights{
        width:94%;

        grid-template-columns:1fr 1fr;

        gap:8px;

        margin-bottom:28px;
    }

    .highlight{
        min-height:70px;

        padding:11px;

        gap:8px;

        border-radius:13px;
    }

    .highlight i{
        font-size:19px;
    }

    .highlight strong{
        font-size:10px;
    }

    .highlight span{
        font-size:8px;
    }


    /* ===============================
       SECTION HP
    =============================== */

    .section{
        width:94%;

        margin:30px auto;
    }

    .section-title{
        margin-bottom:15px;
    }

    .section-title h2{
        font-size:19px;
    }

    .title-line{
        width:5px;

        height:25px;
    }

    .see-all{
        font-size:11px;
    }


    /* ===============================
       PRODUK HP
    =============================== */

    .product-grid{
        grid-template-columns:repeat(2,1fr);

        gap:10px;
    }

    .product-card{
        min-height:430px;

        border-radius:13px;
    }

    .product-image{
        height:170px;
    }

    .product-image img{
        padding:9px;
    }

    .product-info{
        padding:10px;
    }

    .product-name{
        font-size:12px;

        line-height:1.4;

        height:34px;

        min-height:34px;

        -webkit-line-clamp:2;
    }

    .product-category{
        font-size:9px;

        height:16px;

        margin-top:5px;
    }

    .rating{
        font-size:10px;

        height:19px;

        margin-top:5px;
    }

    .price{
        font-size:15px;

        height:26px;

        margin-top:5px;
    }

    .stock{
        font-size:9px;

        height:16px;
    }

    .stock-badge{
        font-size:8px;

        padding:4px 7px;

        left:7px;
        top:7px;
    }

    .product-buttons{
        gap:5px;

        padding-top:7px;
    }

    .product-buttons button{
        height:38px;

        font-size:9px;

        border-radius:8px;
    }


    /* ===============================
       PROMO HP
    =============================== */

    .promo-grid{
        grid-template-columns:1fr;

        gap:10px;
    }

    .promo{
        min-height:135px;

        padding:20px;

        border-radius:15px;
    }

    .promo h3{
        font-size:17px;
    }


    /* ===============================
       MODAL HP
    =============================== */

    .modal{
        padding:10px;
    }

    .modal-box{
        border-radius:18px;

        padding:15px;

        max-height:92vh;
    }

    .detail-content{
        grid-template-columns:1fr;

        gap:10px;
    }

    .detail-image{
        min-height:260px;
    }

    .detail-info{
        padding:10px;
    }

    .detail-info h2{
        font-size:20px;
    }

    .detail-price{
        font-size:24px;
    }


    /* ===============================
       FOOTER HP
    =============================== */

    .footer{
        margin-top:50px;

        padding:35px 20px 25px;
    }

    .footer-grid{
        grid-template-columns:1fr;

        gap:25px;
    }


    /* ===============================
       BOTTOM NAV HP
    =============================== */

    .mobile-nav{
        position:fixed;

        display:flex;

        bottom:0;

        left:0;
        right:0;

        height:70px;

        background:white;

        border-top:1px solid #e5e7eb;

        box-shadow:
        0 -5px 20px rgba(0,0,0,.08);

        z-index:1400;

        justify-content:space-around;

        align-items:center;
    }

    .mobile-nav a{
        font-size:10px;

        color:#64748b;

        display:flex;

        flex-direction:column;

        align-items:center;

        gap:4px;
    }

    .mobile-nav a.active{
        color:#ed0b24;
    }

    .mobile-nav i{
        font-size:20px;
    }

}
